---
layout: default
permalink: /boltmap/
title: Bolt map
kind: map
---
<div class="mapwrap bolt" id="bolt">
  <canvas id="canvas" aria-label="Map of the bolt network"></canvas>
  <div class="bolt-top">
    <span class="bolt-stats" id="stats"></span>
    <span id="stamp" class="pill">Loading</span>
  </div>
  <div class="bolt-msg" id="msg">Loading the bolt network…</div>
  <div class="bolt-tip" id="tip" hidden></div>
  <div class="bolt-hud">
    <div>Scroll to zoom · drag to pan · hover to inspect</div>
    <div id="coords">X: – &nbsp; Z: –</div>
  </div>
  <div class="panel bolt-legend" aria-label="Legend">
    <div><i class="lg-line"></i> Straight bolt</div>
    <div><i class="lg-diag"></i> Diagonal bolt</div>
    <div><i class="lg-vert"></i> Vertical section</div>
    <div><i class="lg-dot"></i> Junction</div>
    <div><i class="lg-sq"></i> Station</div>
    <div><i class="lg-hub"></i> Hub station</div>
    <div class="lg-x-row"><b class="lg-x">✕</b> Hub centre</div>
  </div>
</div>
<script>
const CENTER_X = 264, CENTER_Z = -162, SCAN_RADIUS = 7500;

const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const tip = $('tip'), coordsEl = $('coords'), msg = $('msg'), container = $('bolt');

let data = null;
let scale = 1, offsetX = 0, offsetY = 0;
let dragging = false, dragStartX = 0, dragStartY = 0, dragOffsetX = 0, dragOffsetY = 0;

function resize() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  if (data) draw();
}

// The scan area is square: draw it as the largest square that fits, centred, so angles and
// distances aren't stretched on a wide or tall screen.
const side = () => Math.min(canvas.width, canvas.height);
const padX = () => (canvas.width - side()) / 2, padY = () => (canvas.height - side()) / 2;

function w2c(wx, wz) {
  const span = SCAN_RADIUS * 2;
  const px = padX() + ((wx - (CENTER_X - SCAN_RADIUS)) / span) * side();
  const py = padY() + ((wz - (CENTER_Z - SCAN_RADIUS)) / span) * side();
  return [px * scale + offsetX, py * scale + offsetY];
}

function c2w(cx, cy) {
  const span = SCAN_RADIUS * 2;
  const px = (cx - offsetX) / scale - padX(), py = (cy - offsetY) / scale - padY();
  return [Math.round(CENTER_X - SCAN_RADIUS + (px / side()) * span),
          Math.round(CENTER_Z - SCAN_RADIUS + (py / side()) * span)];
}

// ---- draw
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!data || !data.segments) return;
  // pixels per world block at this zoom; line width follows the world so close parallel
  // bolts stay apart when zoomed in, with a 1px floor so they never vanish
  const wts = (scale * side()) / (SCAN_RADIUS * 2);
  const lineWidth = Math.max(1, Math.min(6, wts * 3));
  const markerR = Math.max(3, lineWidth * 1.6);
  const hubArm = Math.max(12, Math.min(50, wts * 10));

  for (const seg of data.segments) {
    if (seg.type === 'diagonal') { ctx.strokeStyle = 'rgba(235,232,230,.6)'; ctx.setLineDash([]); }
    else if (seg.type === 'vertical') { ctx.strokeStyle = 'rgba(235,232,230,.45)'; ctx.setLineDash([4 * scale, 3 * scale]); }
    else { ctx.strokeStyle = 'rgba(235,232,230,.92)'; ctx.setLineDash([]); }
    ctx.lineWidth = lineWidth;
    const wps = seg.waypoints;
    ctx.beginPath();
    if (wps && wps.length >= 2) {
      const [sx, sy] = w2c(wps[0].x, wps[0].z);
      ctx.moveTo(sx, sy);
      for (let i = 1; i < wps.length; i++) { const [x, y] = w2c(wps[i].x, wps[i].z); ctx.lineTo(x, y); }
    } else {
      const [sx, sy] = w2c(seg.start.x, seg.start.z), [ex, ey] = w2c(seg.end.x, seg.end.z);
      ctx.moveTo(sx, sy); ctx.lineTo(ex, ey);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.lineWidth = 1;
  ctx.fillStyle = '#ebe8e6';
  ctx.strokeStyle = 'rgba(0,0,0,.5)';
  for (const j of (data.junctions || [])) {
    const [px, py] = w2c(j.x, j.z);
    ctx.beginPath(); ctx.arc(px, py, markerR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  for (const s of (data.stations || [])) {
    if (s.is_hub) continue;
    const [px, py] = w2c(s.x, s.z);
    ctx.fillRect(px - markerR, py - markerR, markerR * 2, markerR * 2);
    ctx.strokeRect(px - markerR, py - markerR, markerR * 2, markerR * 2);
  }
  const [hx, hy] = w2c(CENTER_X, CENTER_Z), hubR = markerR * 1.8;
  ctx.fillStyle = '#e5a93c';
  ctx.fillRect(hx - hubR, hy - hubR, hubR * 2, hubR * 2);
  ctx.strokeRect(hx - hubR, hy - hubR, hubR * 2, hubR * 2);
  // hub centre cross, always on top
  ctx.strokeStyle = '#d4543a';
  ctx.lineWidth = Math.max(1.5, lineWidth * 0.8);
  ctx.beginPath();
  ctx.moveTo(hx - hubArm, hy); ctx.lineTo(hx + hubArm, hy);
  ctx.moveTo(hx, hy - hubArm); ctx.lineTo(hx, hy + hubArm);
  ctx.stroke();
}

// ---- hit testing
function pointToSegmentDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(px - ax, py - ay);
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lenSq));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function segPolylineDist(mx, my, seg) {
  const wps = seg.waypoints;
  if (!wps || wps.length < 2) {
    const [sx, sy] = w2c(seg.start.x, seg.start.z), [ex, ey] = w2c(seg.end.x, seg.end.z);
    return pointToSegmentDist(mx, my, sx, sy, ex, ey);
  }
  let best = Infinity;
  for (let i = 0; i < wps.length - 1; i++) {
    const [sx, sy] = w2c(wps[i].x, wps[i].z), [ex, ey] = w2c(wps[i + 1].x, wps[i + 1].z);
    best = Math.min(best, pointToSegmentDist(mx, my, sx, sy, ex, ey));
  }
  return best;
}

function hitTest(mx, my) {
  if (!data) return null;
  const HIT = 8, SEG = 5;   // screen-pixel tolerances for markers and lines
  const [hx, hy] = w2c(CENTER_X, CENTER_Z);
  if (Math.hypot(mx - hx, my - hy) < HIT) {
    const hub = (data.stations || []).find(s => s.is_hub);
    if (hub) return { type: 'station', data: hub };
  }
  for (const j of (data.junctions || [])) {
    const [px, py] = w2c(j.x, j.z);
    if (Math.hypot(mx - px, my - py) < HIT) return { type: 'junction', data: j };
  }
  for (const s of (data.stations || [])) {
    const [px, py] = w2c(s.x, s.z);
    if (Math.hypot(mx - px, my - py) < HIT) return { type: 'station', data: s };
  }
  for (const seg of (data.segments || [])) if (segPolylineDist(mx, my, seg) < SEG) return { type: 'segment', data: seg };
  return null;
}

// ---- tooltip (every value from the JSON goes through C.esc)
function segTypeLabel(seg) {
  if (seg.type === 'vertical') return 'Vertical section';
  if (seg.type === 'diagonal' || (seg.direction && String(seg.direction).length === 2)) return 'Diagonal bolt';
  return 'Straight bolt';
}
const xyz = p => C.esc(p.x) + ', ' + C.esc(p.y) + ', ' + C.esc(p.z);

function showTip(e, hit) {
  if (!hit) { tip.hidden = true; return; }
  const d = hit.data;
  if (hit.type === 'segment') {
    tip.innerHTML = `<b>${segTypeLabel(d)}</b>Direction ${C.esc(d.direction)}<br>Length ${C.esc(d.length)} blocks<br>Start ${xyz(d.start)}<br>End ${xyz(d.end)}`;
  } else if (hit.type === 'junction') {
    tip.innerHTML = `<b>Junction</b>${C.esc(d.connections)} connections<br>${xyz(d)}`;
  } else {
    tip.innerHTML = `<b>${d.is_hub ? 'Hub station' : 'Station'}</b>${xyz(d)}`;
  }
  tip.hidden = false;
  const r = container.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let tx = e.clientX - r.left + 14, ty = e.clientY - r.top + 14;
  if (tx + w > r.width - 8) tx = e.clientX - r.left - w - 14;
  if (ty + h > r.height - 8) ty = e.clientY - r.top - h - 14;
  tip.style.left = tx + 'px';
  tip.style.top = ty + 'px';
}

// ---- pan / zoom
container.addEventListener('mousedown', e => {
  if (e.target !== canvas) return;
  dragging = true; dragStartX = e.clientX; dragStartY = e.clientY; dragOffsetX = offsetX; dragOffsetY = offsetY;
  container.classList.add('drag');
});
window.addEventListener('mouseup', () => { dragging = false; container.classList.remove('drag'); });
window.addEventListener('mousemove', e => {
  if (dragging) {
    offsetX = dragOffsetX + (e.clientX - dragStartX);
    offsetY = dragOffsetY + (e.clientY - dragStartY);
    tip.hidden = true;
    draw();
    return;
  }
  if (e.target !== canvas) { tip.hidden = true; return; }
  const rect = canvas.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [wx, wz] = c2w(mx, my);
  coordsEl.textContent = 'X: ' + wx + '   Z: ' + wz;
  const hit = hitTest(mx, my);
  showTip(e, hit);
  canvas.style.cursor = hit ? 'pointer' : '';
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const ns = Math.max(0.1, Math.min(50, scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
  offsetX = mx - (mx - offsetX) * (ns / scale);
  offsetY = my - (my - offsetY) * (ns / scale);
  scale = ns;
  draw();
}, { passive: false });

let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true; dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY; dragOffsetX = offsetX; dragOffsetY = offsetY;
  } else if (e.touches.length === 2) {
    dragging = false;
    lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    offsetX = dragOffsetX + (e.touches[0].clientX - dragStartX);
    offsetY = dragOffsetY + (e.touches[0].clientY - dragStartY);
    draw();
  } else if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    scale = Math.max(0.1, Math.min(50, scale * (d / lastTouchDist)));
    lastTouchDist = d;
    draw();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { dragging = false; });

// ---- data
const n = v => Number(v || 0).toLocaleString('en-GB');
const count = (v, one, many) => n(v) + ' ' + (Number(v) === 1 ? one : many);
async function load() {
  try {
    const { data: d, at } = await C.json('/data/boltmap.json');
    data = d;
    $('stats').textContent = count((d.segments || []).length, 'segment', 'segments') + ' · ' +
      count((d.junctions || []).length, 'junction', 'junctions') + ' · ' + count((d.stations || []).length, 'station', 'stations') +
      ' · ' + count(d.total_length, 'block', 'blocks') + ' of bolt';
    C.stamp($('stamp'), at);
    if (!d.progress || !d.progress.complete) {
      // the scanner is still running: show progress and check again shortly
      msg.hidden = false;
      msg.textContent = 'Scanning… ' + n(d.progress && d.progress.blocks_found) + ' blocks found so far';
      setTimeout(load, 5000);
    } else msg.hidden = true;
    draw();
  } catch (e) {
    msg.hidden = false;
    msg.textContent = 'No bolt map data yet. It appears here once the scanner has run.';
    $('stamp').className = 'pill stale'; $('stamp').textContent = 'Unavailable';
  }
}

window.addEventListener('resize', resize);
resize();
load();
</script>
