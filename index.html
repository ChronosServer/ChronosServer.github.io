---
layout: default
permalink: /
kind: home
bg: chronos_spawn
---
<header class="hero">
  <span id="live" class="pill" hidden></span>
  <h1>Chronos</h1>
  <p class="tag">Technical Minecraft, where creativity meets innovation.</p>
  <div class="btns">
    <a class="btn main" href="https://discord.gg/VvPucVAjUS" target="_blank" rel="noopener">Join the Discord</a>
    <a class="btn" href="https://github.com/ChronosServer" target="_blank" rel="noopener">GitHub</a>
    <a class="btn" href="https://www.patreon.com/cw/Chronos_SMP" target="_blank" rel="noopener">Support on Patreon</a>
  </div>
  <nav class="index" aria-label="Sections">{% for l in site.data.nav %}{% unless l.url == "/" %}<a href="{{ l.url }}"{% if l.blank %} target="_blank" rel="noopener"{% endif %}><b>{{ l.title }}</b><span>{{ l.desc }}</span></a>{% endunless %}{% endfor %}</nav>
</header>
<script>
C.json('/data/server_status.json').then(({data}) => {
  const s = Object.values(data.servers || data).filter(v => typeof v === 'string');
  if (!s.length) return;
  const p = document.getElementById('live');
  p.textContent = s.filter(v => v === 'Online').length + ' of ' + s.length + ' servers online';
  p.hidden = false;
}).catch(() => {});
</script>
