---
layout: default
permalink: /archive/
title: Public archive
---
<main class="page">
  <h1>Public archive</h1>
  <p class="lede">Posts from our public forum channel. <span id="st" class="pill">Loading</span></p>
  <input class="search" id="q" type="search" placeholder="Search posts" aria-label="Search posts">
  <div class="chips" id="chips"></div>
  <div class="posts" id="posts"></div>
  <button class="toggle" id="more" type="button" hidden><span>Show more</span></button>
</main>
<dialog id="dlg"><div class="dbox"><button class="x" id="x" type="button" aria-label="Close">&times;</button><div id="dc"></div></div></dialog>
<script>
const $ = id => document.getElementById(id);
const PAGE = 18;
let ALL = [], tag = null, shown = PAGE;
const isImg = u => /\.(png|jpe?g|webp|gif)(\?|$)/i.test(u);
const url = u => /^https?:\/\//i.test(u || '') ? C.esc(u) : '#';
const when = iso => new Date(iso).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
const fname = u => { try { return decodeURIComponent(u.split('/').pop().split('?')[0]); } catch (e) { return 'Download'; } };
const thumb = p => (p.attachments || []).find(isImg) || (p.embeds || []).map(e => e.thumbnail || e.image).find(Boolean) || '';

function filtered() {
  const q = $('q').value.trim().toLowerCase();
  return ALL.filter(p => (!tag || (p.tags || []).includes(tag)) && (!q || p.title.toLowerCase().includes(q) || (p.content || '').toLowerCase().includes(q)));
}
function render() {
  const f = filtered();
  $('posts').innerHTML = f.slice(0, shown).map(p => {
    const t = thumb(p);
    return `<button class="post" type="button" data-id="${C.esc(p.id)}">${t ? `<img src="${url(t)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span class="pb"><span class="pa">${C.esc(p.author)}, ${when(p.timestamp)}</span><span class="pt">${C.esc(p.title)}</span><span class="tg">${(p.tags || []).map(x => `<i>${C.esc(x)}</i>`).join('')}</span></span></button>`;
  }).join('') || '<p class="lede">No posts match.</p>';
  $('more').hidden = f.length <= shown;
  $('more').querySelector('span').textContent = 'Show more (' + (f.length - shown) + ' left)';
}
function media(a) {
  a = a || [];
  const files = a.filter(u => !isImg(u));
  return a.filter(isImg).map(u => `<img class="mi" src="${url(u)}" alt="" loading="lazy" onerror="this.remove()">`).join('') +
    (files.length ? '<div class="dl">' + files.map(u => `<a href="${url(u)}" target="_blank" rel="noopener" download>${C.esc(fname(u))}</a>`).join('') + '</div>' : '');
}
function embeds(es) {
  return (es || []).filter(e => e.title || e.url).map(e => `<div class="emb"><a href="${url(e.url)}" target="_blank" rel="noopener">${C.esc(e.title || e.url)}</a>${e.description ? `<p>${C.esc(e.description)}</p>` : ''}</div>`).join('');
}
function openPost(p) {
  const who = (n, av, ts) => `<div class="dm"><img src="${url(av)}" alt="">${C.esc(n)}, ${when(ts)}</div>`;
  $('dc').innerHTML = `<h2 class="dt">${C.esc(p.title)}</h2>${who(p.author, p.author_avatar, p.timestamp)}<div class="db">${C.esc(p.content)}</div>${media(p.attachments)}${embeds(p.embeds)}` +
    (p.messages || []).filter(m => m.content || (m.attachments || []).length || (m.embeds || []).length).map(m => `<div class="rp">${who(m.author, m.author_avatar, m.timestamp)}<div class="db">${C.esc(m.content)}</div>${media(m.attachments)}${embeds(m.embeds)}</div>`).join('');
  $('dlg').showModal();
}

C.json('/data/archive.json').then(({data, at}) => {
  ALL = data;
  const tags = [...new Set(ALL.flatMap(p => p.tags || []))].sort();
  $('chips').innerHTML = ['All', ...tags].map((t, i) => `<button type="button" aria-pressed="${i === 0}" data-t="${i ? C.esc(t) : ''}">${C.esc(t)}</button>`).join('');
  C.stamp($('st'), at, 72);
  render();
}).catch(e => { $('st').textContent = 'Unavailable'; C.fail($('posts'), e); });

$('q').addEventListener('input', () => { shown = PAGE; render(); });
$('more').addEventListener('click', () => { shown += PAGE; render(); });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tag = b.dataset.t || null; shown = PAGE;
  $('chips').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
$('posts').addEventListener('click', e => { const b = e.target.closest('.post'); if (b) openPost(ALL.find(p => p.id === b.dataset.id)); });
$('x').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });
</script>
