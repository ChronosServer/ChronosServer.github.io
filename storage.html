---
layout: default
permalink: /storage/
title: Storage
---
<main class="page">
  <h1>Storage</h1>
  <p class="lede">Everything in the main and dig storage systems, counted from the world files. <span id="st" class="pill">Loading</span></p>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-t="ms">Main storage</button>
    <button role="tab" aria-selected="false" data-t="dig">Dig storage</button>
  </div>
  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Search items" aria-label="Search items">
    <select class="search" id="s" aria-label="Sort"><option value="n">Most items</option><option value="a">A to Z</option></select>
  </div>
  <p class="sum" id="sum"></p>
  <div class="items" id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const S = {ms: null, dig: null};
let tab = 'ms';
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : n.toLocaleString();
function render() {
  const cur = S[tab];
  // the other tab's file can still be loading: don't leave this tab's items under its name
  if (!cur) { $('sum').textContent = ''; $('out').innerHTML = '<p class="lede">Loading…</p>'; return; }
  if (cur.error) { $('sum').textContent = ''; C.fail($('out'), cur.error); $('st').textContent = 'Unavailable'; return; }
  const q = $('q').value.trim().toLowerCase();
  const e = Object.entries(cur.data).filter(([n]) => !q || n.toLowerCase().includes(q));
  e.sort($('s').value === 'a' ? (a, b) => a[0].localeCompare(b[0]) : (a, b) => b[1] - a[1]);
  const total = Object.values(cur.data).reduce((a, b) => a + b, 0);
  $('sum').textContent = Object.keys(cur.data).length.toLocaleString() + ' item types, ' + total.toLocaleString() + ' items in total';
  $('out').innerHTML = e.map(([n, c]) => `<div class="item"><img src="/cache/items/${C.esc(n.toLowerCase().replace(/ /g, '_'))}.png" alt="" width="28" height="28" loading="lazy" onerror="this.style.visibility='hidden'"><span class="nm">${C.esc(n)}</span><span class="ct" title="${c.toLocaleString()}">${fmt(c)}</span></div>`).join('') || '<p class="lede">No items match.</p>';
  C.stamp($('st'), cur.at);
}
['ms', 'dig'].forEach(k => C.json('/data/' + k + '_storage.json')
  .then(r => { S[k] = r; if (k === tab) render(); })
  .catch(error => { S[k] = {error}; if (k === tab) render(); }));
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.t;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  $('q').value = '';
  render();
}));
$('q').addEventListener('input', render);
$('s').addEventListener('change', render);
</script>
