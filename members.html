---
layout: default
permalink: /members/
title: Members
---
<main class="page">
  <h1>Members</h1>
  <p class="lede">The people behind Chronos. <span id="st" class="pill">Loading</span></p>
  <input class="search" id="q" type="search" placeholder="Filter by name" aria-label="Filter members">
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const G = [['Members', 'members', ''], ['Trial members', 'trial', ''], ['Inactive', 'inactive', ' off']];
let DATA = null;
function render() {
  const q = $('q').value.trim().toLowerCase();
  $('out').innerHTML = G.map(([label, key, cls]) => {
    const list = (DATA[key] || []).filter(m => !q || m.name.toLowerCase().includes(q));
    if (!list.length) return '';
    return `<h2>${label} <span class="pill">${list.length}</span></h2><div class="members">` +
      list.map(m => `<div class="member${cls}"><img src="${C.esc(m.avatar)}" alt="" width="36" height="36" loading="lazy"><span>${C.esc(m.name)}</span></div>`).join('') + '</div>';
  }).join('') || '<div class="panel err">No members match.</div>';
}
C.json('/data/members.json').then(({data, at}) => { DATA = data; C.stamp($('st'), at); render(); }).catch(e => { $('st').textContent = 'Unavailable'; C.fail($('out'), e); });
$('q').addEventListener('input', () => DATA && render());
</script>
