---
layout: default
permalink: /gallery/
title: Gallery
---
<main class="page">
  <h1>Gallery</h1>
  <p class="lede">Screenshots of what we build. <span id="n" class="pill">Loading</span></p>
  <div class="masonry" id="g"></div>
</main>
<dialog class="lb" id="lb">
  <button class="x" id="lx" type="button" aria-label="Close">&times;</button>
  <button class="nb prev" id="lp" type="button" aria-label="Previous image">&lsaquo;</button>
  <img id="li" alt="">
  <button class="nb next" id="ln" type="button" aria-label="Next image">&rsaquo;</button>
  <div class="cap" id="lc"></div>
</dialog>
<script>
const $ = id => document.getElementById(id);
let list = [], cur = 0;
const nameOf = p => { try { return decodeURIComponent(p.split('/').pop()); } catch (e) { return p; } };
function show(i) {
  cur = (i + list.length) % list.length;
  $('li').src = list[cur];
  $('lc').textContent = (cur + 1) + ' / ' + list.length + '   ' + nameOf(list[cur]);
}
fetch('/gallery/index.json', {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error('gallery/index.json returned HTTP ' + r.status); return r.json(); }).then(l => {
  list = l;
  $('n').textContent = list.length + ' images';
  $('g').innerHTML = list.map((p, i) => `<button class="g reveal" type="button" data-i="${i}" aria-label="Open image ${i + 1}"><img loading="lazy" decoding="async" alt="" src="${C.esc(p.replace('/gallery/', '/gallery/thumbs/'))}" data-full="${C.esc(p)}"></button>`).join('');
  $('g').querySelectorAll('.reveal').forEach(C.reveal);
}).catch(e => { $('n').textContent = 'Unavailable'; C.fail($('g'), e); });
// a missing thumbnail falls back to the full image
$('g').addEventListener('error', e => { const i = e.target; if (i.tagName === 'IMG' && i.src.includes('/thumbs/')) i.src = i.dataset.full; }, true);
$('g').addEventListener('click', e => { const b = e.target.closest('.g'); if (b) { show(+b.dataset.i); $('lb').showModal(); } });
$('lx').addEventListener('click', () => $('lb').close());
$('lp').addEventListener('click', () => show(cur - 1));
$('ln').addEventListener('click', () => show(cur + 1));
$('lb').addEventListener('click', e => { if (e.target === $('lb')) $('lb').close(); });
$('lb').addEventListener('keydown', e => { if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });
</script>
