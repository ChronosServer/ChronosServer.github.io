---
layout: default
permalink: /status/
title: Status
bg: chronos_spawn
---
<main class="page">
  <h1>Status</h1>
  <p class="lede">Live health of the host machine, and which Chronos servers are up.</p>
  <h2>Host <span id="hw-t" class="pill">Loading</span></h2>
  <div id="hw" class="panel"></div>
  <h2>Servers <span id="sv-t" class="pill">Loading</span></h2>
  <div id="sv"></div>
</main>
<script>
const $ = id => document.getElementById(id);
// Owner's fixed order; anything else goes after, A to Z.
const ORDER = ['smp', 'cmp', 'cmp2', 'cmp3', 'cmp4', 'mirror', 'building', 'building2', 'snapshot', 'tour', 'public'];
const rank = n => { const i = ORDER.indexOf(n.toLowerCase()); return i < 0 ? ORDER.length : i; };
const lvl = (p, w, b) => p > b ? 'bad' : p > w ? 'warn' : '';
const row = (name, p, val, sub, w = 70, b = 90) =>
  `<div class="row"><span class="name">${name}</span>` +
  (p == null ? '<div></div>' : `<div class="meter"><b class="${lvl(p, w, b)}" style="width:${Math.min(p, 100)}%"></b></div>`) +
  `<span class="val">${val}</span><span class="sub">${sub}</span></div>`;

async function hw() {
  try {
    const {data: d} = await C.json('/api/status');
    $('hw').innerHTML =
      row('CPU', d.cpu.percent, d.cpu.percent + '%', `${d.cpu.cores} cores / ${d.cpu.threads} threads, load ${d.cpu.load.join(' / ')}${d.cpu.temp ? ', ' + d.cpu.temp + ' °C' : ''}, up ${C.esc(d.cpu.uptime)}`) +
      row('Memory', d.ram.percent, `${d.ram.used} <small>/ ${d.ram.total} GB</small>`, `${d.ram.percent}% in use`) +
      row('Swap', d.swap.percent, `${d.swap.used} <small>/ ${d.swap.total} GB</small>`, `${d.swap.percent}% in use. Overflow RAM paged to disk; high use is a warning sign`, 40, 80) +
      row('Disk', d.disk.percent, `${d.disk.used} <small>/ ${d.disk.total} GB</small>`, `${d.disk.percent}% of ${d.disk.total_tb} TB used, ${d.disk.write_gb} GB written, ${d.disk.read_gb} GB read`, 80, 92) +
      row('Network', null, `<span class="nw">${d.net.sent_gb} <small>GB ↑</small></span> / <span class="nw">${d.net.recv_gb} <small>GB ↓</small></span>`, 'sent / received since boot');
    $('hw-t').className = 'pill'; $('hw-t').textContent = 'Live';
  } catch (e) {
    C.fail($('hw'), e); $('hw-t').className = 'pill stale'; $('hw-t').textContent = 'Unavailable';
  }
}

async function sv() {
  try {
    const {data, at} = await C.json('/data/server_status.json');
    const e = Object.entries(data.servers || data).filter(([, v]) => typeof v === 'string').sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0]));
    if (!e.length) throw new Error('server_status.json has no servers. Run /sync in Discord.');
    $('sv').className = 'servers';
    $('sv').innerHTML = e.map(([n, s]) => `<div class="srv"><i class="dot ${s === 'Online' ? '' : 'off'}"></i>${C.esc(n.toUpperCase())}<span class="sr-only">${C.esc(s)}</span></div>`).join('');
    C.stamp($('sv-t'), at);
    $('sv-t').textContent = e.filter(([, s]) => s === 'Online').length + ' of ' + e.length + ' online. ' + $('sv-t').textContent;
  } catch (e) { C.fail($('sv'), e); }
}
hw(); sv(); setInterval(hw, 10000); setInterval(sv, 300000);
</script>
